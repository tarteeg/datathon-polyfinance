version: 0.2

# Builds the backend and frontend images and pushes them to Amazon ECR.
# Environment variables (set on the CodeBuild project or per build):
#   IMAGE_TAG  tag for the images, usually the Git commit hash. Defaults to "latest".
# Base images come from the AWS public mirror of Docker Hub to avoid Docker Hub
# pull limits on shared CodeBuild addresses.

phases:
  pre_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - export IMAGE_TAG=${IMAGE_TAG:-latest}
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
  build:
    commands:
      - docker build --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.12-slim -t $REGISTRY/polyfinance/backend:$IMAGE_TAG backend-server
      - docker build --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:24-slim -t $REGISTRY/polyfinance/frontend:$IMAGE_TAG frontend-dashboard
  post_build:
    commands:
      - docker push $REGISTRY/polyfinance/backend:$IMAGE_TAG
      - docker push $REGISTRY/polyfinance/frontend:$IMAGE_TAG
      - echo "Pushed $REGISTRY/polyfinance/backend:$IMAGE_TAG and $REGISTRY/polyfinance/frontend:$IMAGE_TAG"
